org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin's incremental compiler computes relative paths between the build
# output and source files (including plugins in the pub-cache). On Windows,
# if the project and the pub-cache live on different drives (e.g. D:\ vs
# C:\), that relative-path computation throws "this and base files have
# different roots" and crashes the Kotlin daemon. Disabling incremental
# compilation avoids it.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
